[package]
name = "sauva"
version = "0.3.0"
description = "Terminal Unicode Explorer"
authors = ["Kyosuke Fujimoto <kyoro.f@gmail.com>"]
homepage = "https://github.com/lusingander/sauva"
repository = "https://github.com/lusingander/sauva"
readme = "README.md"
license = "MIT"
keywords = ["unicode", "cli", "tui", "terminal"]
categories = ["command-line-utilities"]
edition = "2024"
rust-version = "1.88.0"

exclude = ["/.github", "/img", "/data", "/tools"]

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
fontdb = "0.24.0"
garde = { version = "0.23.0", features = ["derive"] }
png = "0.18.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
smart-default = "0.7.1"
swash = "0.2.10"
toml = "1.1.6"
tui-input = { version = "0.15.4", default-features = false, features = ["crossterm"] }
umbra = "0.5.0"
# Keep algorithm data aligned with the bundled UCD; update these together.
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-text = "22.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
yeslogic-fontconfig-sys = { version = "6.0.1", features = ["dlopen"] }

[dev-dependencies]
insta = { version = "1.48.0", default-features = false }
rstest = { version = "0.27.0", default-features = false }
termlens = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
